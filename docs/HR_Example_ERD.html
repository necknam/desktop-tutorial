<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR 서비스 ERD</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --card: #ffffff; --ink: #1f2430; --muted: #6b7280;
  --line-soft: #e3e6ec; --head: #f0f2f6; --shadow: 0 1px 3px rgba(20,24,40,.10);
  --c1: #2f6fed; --c2: #0f9d8a; --c3: #d98a00; --c4: #8b5cf6; --c5: #2e9e4f;
  --pk: #d98a00; --fk: #2f6fed;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --panel: #1b1f27; --card: #232834; --ink: #e8eaf0; --muted: #9aa3b2;
    --line-soft: #343b49; --head: #2a3040; --shadow: 0 1px 3px rgba(0,0,0,.5);
    --c1: #6f9bff; --c2: #3fc4b0; --c3: #f0b040; --c4: #ae8cff; --c5: #5cc47a;
    --pk: #f0b040; --fk: #6f9bff;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --panel: #1b1f27; --card: #232834; --ink: #e8eaf0; --muted: #9aa3b2;
  --line-soft: #343b49; --head: #2a3040; --shadow: 0 1px 3px rgba(0,0,0,.5);
  --c1: #6f9bff; --c2: #3fc4b0; --c3: #f0b040; --c4: #ae8cff; --c5: #5cc47a;
  --pk: #f0b040; --fk: #6f9bff;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
.bar { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line-soft);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; }
.bar h1 { font-size: 16px; margin: 0; }
.bar .sub { color: var(--muted); font-size: 12px; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.ctl button { border: 1px solid var(--line-soft); background: var(--card); color: var(--ink); border-radius: 6px;
  padding: 3px 9px; font-size: 12px; cursor: pointer; }
.ctl button:hover { background: var(--head); }
.ctl label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 26px; height: 0; border-top: 2px solid var(--muted); vertical-align: middle; margin-right: 4px; }
.legend i.dash { border-top-style: dashed; }
.legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 4px; }
.legend .tick { display: inline-block; width: 2px; height: 11px; background: var(--muted); margin-right: 4px; vertical-align: middle; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 4px; }
#viewport { overflow: auto; height: calc(100vh - 92px); min-height: 400px; }
#stage { transform-origin: 0 0; position: relative; }
#canvas { position: relative; padding: 28px; display: grid; gap: 56px 70px;
  grid-template-columns: 660px 300px 300px 1060px;
  grid-template-areas: "p3 p2 p1 p5" "p3 p2 p4 p5"; align-items: start; }
#links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 1; }
.panel { position: relative; background: var(--panel); border: 1px solid var(--line-soft); border-top: 4px solid var(--pc);
  border-radius: 12px; padding: 40px 18px 20px; box-shadow: var(--shadow); }
.panel > .ptitle { position: absolute; left: 14px; top: 10px; font-weight: 700; font-size: 13px; color: var(--pc); }
.panel > .ptitle small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.pbody { display: grid; gap: 22px; }
.card { background: var(--card); border: 1px solid var(--line-soft); border-radius: 8px; box-shadow: var(--shadow);
  overflow: hidden; position: relative; z-index: 2; transition: opacity .12s; }
.card .ch { background: var(--head); padding: 6px 10px; border-bottom: 2px solid var(--pc); }
.card .ch b { font-size: 13px; display: block; }
.card .ch span { font-family: Consolas, "D2Coding", monospace; font-size: 10.5px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 6px; padding: 2px 10px; font-size: 11.5px; height: 22px; border-top: 1px solid var(--line-soft); }
.row:first-of-type { border-top: 0; }
.row .bd { width: 20px; flex: none; font-size: 9px; font-weight: 700; text-align: center; }
.row .bd.pk { color: var(--pk); } .row .bd.fk { color: var(--fk); }
.row .nm { font-family: Consolas, "D2Coding", monospace; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.is-pk .nm { font-weight: 700; }
.row .ty { color: var(--muted); font-size: 10px; flex: none; }
.row .nn { color: var(--muted); font-size: 9px; flex: none; }
.row.link-hl { background: color-mix(in srgb, var(--pc) 16%, transparent); }
body.kr .row .nm { font-family: inherit; font-size: 11.5px; }
.dim { opacity: .18; }
path.ln { fill: none; stroke-width: 1.6; opacity: .8; transition: opacity .12s, stroke-width .12s; }
path.ln.inf { stroke-dasharray: 6 4; }
path.ln.on { stroke-width: 2.8; opacity: 1; }
path.ln.dim { opacity: .07; }
.mk { transition: opacity .12s; }
.mk.dim { opacity: .07; }
.hint { padding: 8px 16px; font-size: 12px; color: var(--muted); }
</style>
</head>

</div>

  pn.className = 'panel'; pn.style.setProperty('--pc', `var(--${p.color})`); pn.style.gridArea = p.area;
  const n = p.skill ? 11 : p.tables.length;
  pn.innerHTML = `<div class="ptitle">${p.title}<small>${n}개 테이블</small></div>`;
  const body = document.createElement('div'); body.className = 'pbody';
  if (p.skill) {
    body.style.gridTemplateColumns = '280px 280px 280px'; body.style.columnGap = '90px'; body.style.justifyContent = 'space-between';
    SKILL_ROWS.forEach((r, i) => {
      const a = makeCard(r[0], p.color); a.style.gridColumn = 1; a.style.gridRow = i + 1; body.appendChild(a);
      const b = makeCard(r[1], p.color); b.style.gridColumn = 2; b.style.gridRow = i + 1; b.style.alignSelf = 'center'; body.appendChild(b);
    });
    const s = makeCard('skill_tags', p.color); s.style.gridColumn = 3; s.style.gridRow = '1 / span 5'; s.style.alignSelf = 'center';
    body.appendChild(s);
  } else {
    body.style.gridTemplateColumns = `repeat(${p.cols || 1}, 280px)`; body.style.columnGap = '60px';
    for (const t of p.tables) body.appendChild(makeCard(t, p.color));
  }
  pn.appendChild(body); canvas.appendChild(pn);
}

document.getElementById('cT').textContent = Object.keys(T).length;
document.getElementById('cR').textContent = D.rels.length + ' (선언 ' + D.rels.filter(r => r.k === 'fk').length + ' + 추정 ' + D.rels.filter(r => r.k === 'inf').length + ')';
document.getElementById('lg').innerHTML = PANELS.map(p => `<span><span class="sw" style="background:var(--${p.color})"></span>${p.title}</span>`).join(' ');

let scale = 1;
const NS = 'http://www.w3.org/2000/svg';
let drawn = [];

function pos(el, cv) {
  const r = el.getBoundingClientRect();
  return { l: (r.left - cv.left) / scale, r: (r.right - cv.left) / scale, t: (r.top - cv.top) / scale, b: (r.bottom - cv.top) / scale };
}

function draw() {
  svg.innerHTML = ''; drawn = [];
  const cv = canvas.getBoundingClientRect();
  const W = canvas.scrollWidth, H = canvas.scrollHeight;
  svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const showInf = document.getElementById('tInf').checked;
  D.rels.forEach((r, k) => {
    if (r.k === 'inf' && !showInf) return;
    const sc = cardEl[r.t], tc = cardEl[r.rt];
    const sr = sc.querySelector(`.row[data-c="${r.c}"]`), tr = tc.querySelector(`.row[data-c="${r.rc}"]`);
    const sp = pos(sc, cv), tp = pos(tc, cv), sy = (pos(sr, cv).t + pos(sr, cv).b) / 2, ty = (pos(tr, cv).t + pos(tr, cv).b) / 2;
    let sx, tx, c1x, c2x, dir;
    const gap = 6;
    if (sp.r + 20 < tp.l) { sx = sp.r; tx = tp.l; dir = 1; const d = Math.max(50, (tx - sx) * 0.45); c1x = sx + d; c2x = tx - d; }
    else if (tp.r + 20 < sp.l) { sx = sp.l; tx = tp.r; dir = -1; const d = Math.max(50, (sx - tx) * 0.45); c1x = sx - d; c2x = tx + d; }
    else {
      // 같은 열: 오른쪽으로 돌아서 연결
      sx = sp.r; tx = tp.r; dir = 1;
      const d = 26 + Math.min(Math.abs(ty - sy) * 0.08, 30) + (k % 4) * 7; c1x = sx + d; c2x = tx + d;
    }
    const col = `var(--${tableColor[r.t]})`;
    const g = document.createElementNS(NS, 'g');
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', `M${sx},${sy} C${c1x},${sy} ${c2x},${ty} ${tx},${ty}`);
    p.setAttribute('class', 'ln ' + r.k); p.setAttribute('stroke', col);
    g.appendChild(p);
    // N 쪽(자식) 점, 1 쪽(부모) 막대
    const dot = document.createElementNS(NS, 'circle');
    dot.setAttribute('cx', sx + (sx === sp.r ? gap : -gap)); dot.setAttribute('cy', sy); dot.setAttribute('r', 3.6); dot.setAttribute('fill', col); dot.setAttribute('class', 'mk');
    const side = (tx === tp.l) ? -1 : 1;
    const bar = document.createElementNS(NS, 'line');
    bar.setAttribute('x1', tx + side * 5); bar.setAttribute('x2', tx + side * 5); bar.setAttribute('y1', ty - 6); bar.setAttribute('y2', ty + 6);
    bar.setAttribute('stroke', col); bar.setAttribute('stroke-width', 2.4); bar.setAttribute('class', 'mk');
    g.appendChild(dot); g.appendChild(bar);
    svg.appendChild(g);
    drawn.push({ r, p, dot, bar, sr, tr });
  });
}

function focus(name) {
  const rel = new Set([name]);
  for (const d of drawn) {
    const hit = d.r.t === name || d.r.rt === name;
    d.p.classList.toggle('on', hit); d.p.classList.toggle('dim', !hit);
    d.dot.classList.toggle('dim', !hit); d.bar.classList.toggle('dim', !hit);
    if (hit) { rel.add(d.r.t); rel.add(d.r.rt); d.sr.classList.add('link-hl'); d.tr.classList.add('link-hl'); }
  }
  for (const [n, el] of Object.entries(cardEl)) el.classList.toggle('dim', !rel.has(n));
}
function unfocus() {
  for (const d of drawn) {
    d.p.classList.remove('on', 'dim'); d.dot.classList.remove('dim'); d.bar.classList.remove('dim');
    d.sr.classList.remove('link-hl'); d.tr.classList.remove('link-hl');
  }
  for (const el of Object.values(cardEl)) el.classList.remove('dim');
}
let pinned = null;
for (const [n, el] of Object.entries(cardEl)) {
  el.addEventListener('mouseenter', () => { if (!pinned) focus(n); });
  el.addEventListener('mouseleave', () => { if (!pinned) unfocus(); });
  el.addEventListener('click', (e) => { e.stopPropagation(); if (pinned === n) { pinned = null; unfocus(); } else { pinned = n; unfocus(); focus(n); } });
}
document.getElementById('viewport').addEventListener('click', () => { pinned = null; unfocus(); });

const stage = document.getElementById('stage');
function setScale(s) {
  scale = Math.max(0.25, Math.min(1.6, s));
  stage.style.transform = `scale(${scale})`;
  stage.style.width = canvas.scrollWidth * scale + 'px'; stage.style.height = canvas.scrollHeight * scale + 'px';
  document.getElementById('zv').textContent = Math.round(scale * 100) + '%';
  draw(); if (pinned) focus(pinned);
}
function fit() { setScale(Math.min(1, (document.getElementById('viewport').clientWidth - 8) / canvas.scrollWidth)); }
document.getElementById('zi').onclick = () => setScale(scale + 0.1);
document.getElementById('zo').onclick = () => setScale(scale - 0.1);
document.getElementById('zf').onclick = fit;
document.getElementById('tInf').onchange = () => { draw(); if (pinned) focus(pinned); };
document.getElementById('tKr').onchange = (e) => {
  document.body.classList.toggle('kr', e.target.checked);
  document.querySelectorAll('.nm').forEach(n => n.textContent = e.target.checked ? n.dataset.kr : n.dataset.en);
};
document.getElementById('tTheme').onclick = () => {
  const r = document.documentElement, dark = getComputedStyle(r).getPropertyValue('--bg').trim() === '#14171d';
  r.dataset.theme = dark ? 'light' : 'dark';
};
window.addEventListener('resize', fit);
fit();
</script>
</body>
</html>
